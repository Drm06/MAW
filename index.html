<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="媒介炼金工坊 Medium Alchemy Studio 的游戏项目、作品集锦与个人介绍。">
    <title>媒介炼金工坊</title>
    <link rel="icon" href="assets/robot-head.ico" sizes="any">
    <link rel="stylesheet" href="styles.css">
    <script src="portfolio-content.js" defer></script>
    <script src="site.js" defer></script>
</head>
<body>
    <main class="site-shell">
        <header class="site-header">
            <h1 id="title">媒介炼金工坊<span lang="en">Medium Alchemy Studio</span></h1>
            <button type="button" id="showreel" aria-haspopup="dialog">
                <span class="play-icon" aria-hidden="true"></span>作品集锦
            </button>
        </header>
        <section id="projects" class="gallery" aria-label="项目"></section>
    </main>

    <button type="button" id="character" aria-label="关于我" aria-haspopup="dialog">
        <img src="avatar2.png" alt="">
    </button>
    <div class="bubble-container" aria-hidden="true">
        <div class="bubble"></div>
    </div>

    <dialog class="panel project-panel" aria-labelledby="project-title">
        <div class="panel-scroll">
            <button type="button" class="panel-close" aria-label="关闭" autofocus>×</button>
            <h2 class="panel-title" id="project-title"></h2>
            <div class="panel-content"></div>
        </div>
    </dialog>
    <dialog class="panel character-panel" aria-labelledby="about-title">
        <div class="panel-scroll">
            <button type="button" class="panel-close" aria-label="关闭" autofocus>×</button>
            <h2 class="panel-title" id="about-title"></h2>
            <div class="panel-content"></div>
        </div>
    </dialog>
</body>
</html>
